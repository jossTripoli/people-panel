<app-breadcrumb [items]="breadcrumbs" />

<h1 class="text-2xl font-semibold">Users</h1>

<p class="mt-2 text-slate-800">
  Manage users, roles, and access across your organization.
</p>

<button
  type="button"
  class="rounded-md bg-primary px-4 py-2 font-medium cursor-pointer text-white hover:opacity-90 mt-6"
  (click)="isCreating = true"
>
  Create User
</button>

@if (isCreating) {
  <div class="mt-6 rounded-md border border-divider bg-white p-6">
    <h2 class="text-lg font-semibold">Create User Form</h2>

    <div>
      <label for="name" class="text-slate-700 font-medium">Name</label>
      <input
        id="name"
        type="text"
        [(ngModel)]="newUser.name"
        class="mt-1 w-full rounded-md border border-divider px-3 py-2"
      />
    </div>

    <div>
      <label for="email" class="text-slate-700 font-medium">Email</label>
      <input
        id="email"
        type="email"
        [(ngModel)]="newUser.email"
        class="mt-1 w-full rounded-md border border-divider px-3 py-2"
      />
    </div>

    <button
      type="button"
      class="mt-4 text-sm underline cursor-pointer"
      (click)="isCreating = false"
    >
      Cancel
    </button>
  </div>
}

<div class="mt-6 overflow-hidden rounded-md border border-divider bg-white/90">
  <table class="w-full text-left">
    <thead class="bg-secondary/10">
      <tr class="border-b border-divider">
        <th class="px-4 py-3 font-semibold">Name</th>
        <th class="px-4 py-3 font-semibold">Email</th>
        <th class="px-4 py-3 font-semibold">Role</th>
        <th class="px-4 py-3 font-semibold">Status</th>
      </tr>
    </thead>

    <tbody>
      @for (user of users.body.items; track user.id) {
        <tr
          class="border-b border-divider transition-colors last:border-b-0 hover:bg-slate-50"
        >
          <td class="px-4 py-4">{{ user.name }}</td>
          <td class="px-4 py-4">{{ user.email }}</td>
          <td class="px-4 py-4">{{ user.role }}</td>
          <td class="px-4 py-4">{{ user.status }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>
