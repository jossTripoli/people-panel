<header class="border-b-2 border-divider">

  <!-- Flex row so navbar items say aligned across the navbar -->
  <div class="flex items-center mx-auto max-w-screen-2xl px-6">
    <a routerLink="/users" class="flex items-center gap-3 py-4">
      <img src="/logo.svg" alt="" class="w-12" />

      <span class="text-lg font-semibold text-primary">
        People<span class="text-secondary">Panel</span>
      </span>
    </a>

    <nav aria-label="Main navigation">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="font-semibold underline underline-offset-8"
          ariaCurrentWhenActive="page"
          class="py-4 px-4 hover:text-primary"
        >
          {{ link.label }}
        </a>
      }
      
    </nav>

    <div class="ml-auto h-9 w-9 rounded-full bg-primary text-white font-semibold flex items-center justify-center" aria-label="Current user">
      J
    </div>
    
  </div>
</header>
