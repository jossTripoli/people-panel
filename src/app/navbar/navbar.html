<header class="border-b-2 border-divider">
  <div class="mx-auto max-w-screen-2xl">
    <a routerLink="/users" class="flex items-center gap-3 py-4">
      <img src="/logo.svg" alt="" class="w-12" />

      <span class="text-lg font-semibold text-primary">
        People<span class="text-secondary">Panel</span>
      </span>

      <nav aria-label="Main navigation">
        @for (link of links; track link.path) {
          <a
            [routerLink]="link.path"
            routerLinkActive="font-semibold underline underline-offset-8"
            class="py-4 px-4 hover:text-primary"
          >
            {{ link.label }}
          </a>
        }
      </nav>

    </a>
  </div>
</header>
