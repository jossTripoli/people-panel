<header class="border-b-2 border-divider">

  <!-- Flex keeps the navbar in one row on larger screens. Collapses on smaller screens -->
  <div class="flex flex-wrap items-center mx-auto max-w-screen-2xl px-4 gap-x-6">
    <a routerLink="/users" class="flex items-center gap-3 py-4">
      <img src="/logo.svg" alt="" class="w-12" />

      <span class="text-lg font-semibold text-primary">
        People<span class="text-secondary">Panel</span>
      </span>
    </a>

    <nav
      aria-label="Main navigation"
      class="order-last flex w-full sm:ml-6 gap-8 sm:order-0 sm:w-auto"
    >
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="font-semibold text-secondary underline decoration-3 decoration-secondary underline-offset-17 sm:underline-offset-28"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
          ariaCurrentWhenActive="page"
          class="py-3 hover:text-primary sm:py-4"
        >
          {{ link.label }}
        </a>
      }
    </nav>

    <div
      class="ml-auto flex h-9 w-9 items-center justify-center rounded-full bg-primary text-white font-semibold"
      aria-label="Current user"
    >
      J
    </div>
  </div>
</header>
