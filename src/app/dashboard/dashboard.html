<h1 class="mt-10 text-2xl font-semibold">Dashboard</h1>

<div class="mt-8 grid gap-6 lg:grid-cols-[1.5fr_1fr]">
  <section class="rounded-lg border border-divider bg-white">
    <div class="border-b border-divider px-6 py-4">
      <h2 class="text-lg font-semibold">Actions</h2>
    </div>

    <div class="p-6">
      <p class="text-slate-700">
        What would you like to do?
      </p>

      <div class="mt-5 grid gap-3 sm:grid-cols-2">
        <a
          routerLink="/users"
          class="group flex items-center justify-between rounded-md border border-primary/20 bg-white px-5 py-4 transition-colors hover:bg-primary/5"
        >
          <span>
            <span class="block font-medium text-primary">
              Manage Users
            </span>

            <span class="mt-1 block text-sm text-slate-600">
              Roles, access, and account actions
            </span>
          </span>

          <span
            class="text-xl text-primary transition-transform group-hover:translate-x-1"
            aria-hidden="true"
          >
            →
          </span>
        </a>

        <a
          routerLink="/activity"
          class="group flex items-center justify-between rounded-md border border-primary/20 bg-white px-5 py-4 transition-colors hover:bg-primary/5"
        >
          <span>
            <span class="block font-medium text-primary">
              View Activity
            </span>

            <span class="mt-1 block text-sm text-slate-600">
              Review recent administrative actions
            </span>
          </span>

          <span
            class="text-xl text-primary transition-transform group-hover:translate-x-1"
            aria-hidden="true"
          >
            →
          </span>
        </a>
      </div>
    </div>
  </section>

  <section class="rounded-lg border border-divider bg-white">
    <div class="border-b border-divider px-6 py-4">
      <h2 class="text-lg font-semibold">System snapshot</h2>
    </div>

    <dl class="divide-y divide-divider">
      <div class="flex items-center justify-between px-6 py-5">
        <dt class="text-slate-600">Total users</dt>
        <dd class="text-xl font-semibold">{{ snapshot.total }}</dd>
      </div>

      <div class="flex items-center justify-between px-6 py-5">
        <dt class="text-slate-600">Active</dt>
        <dd class="text-xl font-semibold">{{ snapshot.active }}</dd>
      </div>

      <div class="flex items-center justify-between px-6 py-5">
        <dt class="text-slate-600">Invited</dt>
        <dd class="text-xl font-semibold">{{ snapshot.invited }}</dd>
      </div>

      <div class="flex items-center justify-between px-6 py-5">
        <dt class="text-slate-600">Suspended</dt>
        <dd class="text-xl font-semibold">{{ snapshot.suspended }}</dd>
      </div>
    </dl>
  </section>
</div>
